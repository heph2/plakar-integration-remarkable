name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 -m json.tool importer/schema.json >/dev/null
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
